<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agarwal Estates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Agarwal Estates</a>
            {% if session.get('user') %}
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/price_predict">Price Prediction</a>
                <a class="nav-link" href="/compare">Compare Localities</a>
                <a class="nav-link" href="/emi">EMI Calculator</a>
                <a class="nav-link" href="/nri_desk">NRI Desk</a>
                {% if session.get('role') == 'admin' %}
                    <a class="nav-link text-warning" href="/portfolio">Portfolio</a>
                    <a class="nav-link text-warning" href="/audit_logs">Audit Logs</a>
                    <a class="nav-link text-warning" href="/dataset_management">Dataset</a>
                {% endif %}
            </div>
            <div class="navbar-nav">
                <span class="nav-link text-info">User: {{ session.get('user') }} ({{ session.get('role') }})</span>
                <a class="btn btn-outline-danger btn-sm ms-2" href="/logout">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
