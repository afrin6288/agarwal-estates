{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-3">Register</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name / Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select">
                        <option value="user">Standard User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin PIN (if registering as Admin)</label>
                    <input type="password" name="admin_pin" class="form-control" placeholder="Default: 1234">
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 text-center">Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
