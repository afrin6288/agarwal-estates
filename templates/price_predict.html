{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">Property Price Predictor</h2>
            <form method="POST" action="{{ url_for('price_predict') }}">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Locality / Area</label>
                        <select name="location" class="form-select" required>
                            <option value="" disabled selected>Select Locality</option>
                            {% for loc in locations %}
                                <option value="{{ loc }}">{{ loc }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Square Feet</label>
                        <input type="number" name="sqft" class="form-control" placeholder="e.g. 1200" value="1200" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">BHK</label>
                        <input type="number" name="bhk" class="form-control" value="2" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Bathrooms</label>
                        <input type="number" name="bathrooms" class="form-control" value="2" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Predict Price</button>
            </form>

            {% if prediction %}
            <div class="alert alert-success mt-4" role="alert">
                <h4>Estimated Price: {{ prediction.price }}</h4>
                <p class="mb-0">Location: {{ prediction.location }} | Area: {{ prediction.sqft }} sqft | {{ prediction.bhk }} BHK</p>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
