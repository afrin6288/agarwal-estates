{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow">
    <h3>Property Price Predictor</h3>
    <form method="POST" class="mt-3">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Locality / Area</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Whitefield" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Square Feet</label>
                <input type="number" name="sqft" class="form-control" value="1200" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">BHK</label>
                <input type="number" name="bhk" class="form-control" value="2" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Bathrooms</label>
                <input type="number" name="bathrooms" class="form-control" value="2" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4">Predict Price</button>
    </form>

    {% if prediction %}
        <div class="alert alert-success mt-4">
            <h4>Estimated Valuation: {{ prediction.price }}</h4>
            <p>Location: {{ prediction.location }} | Size: {{ prediction.sqft }} sqft | {{ prediction.bhk }} BHK</p>
        </div>
    {% endif %}
</div>
{% endblock %}
