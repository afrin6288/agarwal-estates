{% extends "base.html" %}
{% block content %}
<div class="card p-4 shadow">
    <h3>EMI Calculator</h3>
    <p class="text-muted">Calculate monthly installments for real estate financing.</p>
    <div class="mb-3">
        <label class="form-label">Loan Amount (₹)</label>
        <input type="number" id="amount" class="form-control" value="5000000">
    </div>
    <div class="mb-3">
        <label class="form-label">Interest Rate (% per annum)</label>
        <input type="number" step="0.1" id="rate" class="form-control" value="8.5">
    </div>
    <div class="mb-3">
        <label class="form-label">Tenure (Years)</label>
        <input type="number" id="years" class="form-control" value="20">
    </div>
    <button onclick="calculateEMI()" class="btn btn-primary">Calculate</button>
    <h4 class="mt-4" id="result"></h4>
</div>
<script>
function calculateEMI() {
    let p = parseFloat(document.getElementById('amount').value);
    let r = parseFloat(document.getElementById('rate').value) / 12 / 100;
    let n = parseFloat(document.getElementById('years').value) * 12;
    let emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    document.getElementById('result').innerText = "Monthly EMI: ₹" + Math.round(emi).toLocaleString('en-IN');
}
</script>
{% endblock %}
